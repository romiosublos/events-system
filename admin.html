<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - حضانات الغد</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>🔐</text></svg>">
  
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ==================== ADMIN HEADER ==================== -->
<header class="admin-header">
  <div class="container admin-header-content">
    <div class="admin-logo">
      <span>🔐</span>
      <h1>لوحة التحكم</h1>
    </div>
    <button id="logoutBtn" onclick="logout()" class="logout-btn" style="display: none;">
      🚪 تسجيل الخروج
    </button>
  </div>
</header>

<!-- ==================== LOGIN SECTION ==================== -->
<section id="loginBox" class="login-section">
  <form class="login-card" onsubmit="handleLogin(event)">
    <div class="login-header">
      <h2>🔐 دخول إداري</h2>
      <p>أدخل بيانات اعتمادك</p>
    </div>
    
    <div class="form-group">
      <label for="email">البريد الإلكتروني</label>
      <input 
        id="email" 
        type="email" 
        placeholder="your@email.com" 
        required
      >
    </div>
    
    <div class="form-group">
      <label for="password">كلمة المرور</label>
      <input 
        id="password" 
        type="password" 
        placeholder="••••••••" 
        required
      >
    </div>
    
    <button type="submit" class="btn btn-primary btn-block">
      ✅ دخول
    </button>
  </form>
</section>

<!-- ==================== ADMIN PANEL ==================== -->
<section id="adminPanel" style="display: none;" class="admin-container">
  <div class="admin-grid">
    
    <!-- ==================== FORM SECTION ==================== -->
    <form class="form-card" onsubmit="handleAddEvent(event)">
      <h2>➕ إضافة فعالية</h2>
      
      <div class="form-group">
        <label for="name">اسم الفعالية *</label>
        <input 
          id="name" 
          type="text" 
          placeholder="مثال: ندوة تطوير الأطفال"
          required
        >
      </div>
      
      <div class="form-group">
        <label for="date">التاريخ *</label>
        <input 
          id="date" 
          type="date"
          required
        >
      </div>
      
      <div class="form-group">
        <label for="image">صورة الفعالية (رابط اختياري)</label>
        <input 
          id="image" 
          type="url" 
          placeholder="https://example.com/image.jpg"
        >
      </div>
      
      <div class="form-group">
        <label for="meeting">رابط الاجتماع *</label>
        <input 
          id="meeting" 
          type="url" 
          placeholder="https://zoom.us/..."
          required
        >
      </div>
      
      <div class="form-group">
        <label for="attendance">رابط تسجيل الحضور *</label>
        <input 
          id="attendance" 
          type="url" 
          placeholder="https://forms.google.com/..."
          required
        >
      </div>
      
      <div class="form-group">
        <label for="media">رابط الفيديو/الوسائط *</label>
        <input 
          id="media" 
          type="url" 
          placeholder="https://youtube.com/..."
          required
        >
      </div>
      
      <button type="submit" class="btn btn-success btn-block">
        💾 حفظ الفعالية
      </button>
    </form>
    
    <!-- ==================== EVENTS LIST SECTION ==================== -->
    <div class="events-card">
      <h2>📋 الفعاليات المضافة</h2>
      
      <div class="events-list" id="events"></div>
      
      <div id="empty-state" class="empty-state" style="display: none; padding: 2rem 0;">
        <div class="empty-state-content">
          <span class="empty-icon">📭</span>
          <h3>لم تُضف فعاليات بعد</h3>
          <p>ابدأ بإضافة فعالية جديدة من الجانب</p>
        </div>
      </div>
    </div>
    
  </div>
</section>

<script src="admin.js"></script>

</body>
</html>
