<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Alghad Nursery</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="header">
  <h1>🌟 حضانة الغد</h1>
  <button onclick="openLogin()">Admin Login</button>
</div>

<div class="container">

<!-- ADMIN PANEL -->
<div id="adminPanel" class="admin" style="display:none;">
  <h3>➕ إضافة حدث</h3>

  <input id="name" placeholder="اسم الحدث">
  <input id="date" type="date">
  <input id="image" placeholder="رابط الصورة">
  <input id="meeting" placeholder="رابط الاجتماع">
  <input id="attendance" placeholder="رابط الحضور">
  <input id="media" placeholder="رابط الفيديو">

  <button onclick="addEvent()">إضافة</button>
</div>

<!-- EVENTS -->
<div id="events"></div>

</div>

<script src="script.js"></script>
</body>
</html>
