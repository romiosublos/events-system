<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="بوابة الفعاليات - حضانات الغد بني ياس1">
  <title>الفعاليات - حضانات الغد بني ياس1</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>🌟</text></svg>">
  
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ==================== NAVBAR ==================== -->
<nav class="navbar">
  <div class="container navbar-content">
    <div class="logo">
      <span class="logo-icon">🌟</span>
      <div>
        <h1>حضانات الغد - بني ياس1</h1>
        <p class="tagline">بوابة الفعاليات والأنشطة</p>
      </div>
    </div>
  </div>
</nav>

<!-- ==================== HERO SECTION ==================== -->
<section class="hero">
  <div class="container">
    <div class="hero-content">
      <h1>🎉 مرحباً بك في بوابة الفعاليات</h1>
      <p>تابع آخر الفعاليات والأنشطة التعليمية</p>
    </div>
  </div>
</section>

<!-- ==================== FILTERS SECTION ==================== -->
<section class="filters-section">
  <div class="container">
    <div class="filters-container">
      <!-- Search by Name -->
      <div class="search-box">
        <input 
          id="searchInput" 
          type="text" 
          placeholder="🔍 ابحث عن فعالية..."
          onkeyup="filterAndSortEvents()"
        >
      </div>

      <!-- Sort by Date -->
      <div class="sort-box">
        <label for="sortSelect">📅 ترتيب حسب:</label>
        <select 
          id="sortSelect" 
          onchange="filterAndSortEvents()"
        >
          <option value="newest">الأحدث أولاً</option>
          <option value="oldest">الأقدم أولاً</option>
        </select>
      </div>
    </div>
  </div>
</section>

<!-- ==================== EVENTS SECTION ==================== -->
<section class="events-section">
  <div class="container">
    <div class="events-grid" id="events"></div>
    
    <div id="empty-state" class="empty-state" style="display: none;">
      <div class="empty-state-content">
        <span class="empty-icon">📭</span>
        <h3>لم يتم العثور على فعاليات</h3>
        <p>حاول البحث أو التصفية بشكل مختلف</p>
      </div>
    </div>
  </div>
</section>

<!-- ==================== FOOTER ==================== -->
<footer class="footer">
  <div class="container">
    <div class="footer-content">
      <p>&copy; 2026 حضانات الغد - بني ياس1. جميع الحقوق محفوظة.</p>
    </div>
  </div>
</footer>

<script src="public.js"></script>

</body>
</html>
