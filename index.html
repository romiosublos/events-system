<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Alghad Nursery</title>

<!-- Firebase v8 CDN (IMPORTANT) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="header">
  <h1>🌟 حضانة الغد</h1>
  <button onclick="document.getElementById('loginBox').style.display='block'">
    Admin Login
  </button>
</div>

<div class="container">

<!-- LOGIN BOX -->
<div id="loginBox" class="loginBox" style="display:none;">
  <h3>Admin Login</h3>

  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button onclick="login()">Login</button>
  <button onclick="document.getElementById('loginBox').style.display='none'">Close</button>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel" class="admin" style="display:none;">
  <h3>➕ Add Event</h3>

  <input id="name" placeholder="Event name">
  <input id="date" type="date">
  <input id="image" placeholder="Image URL">
  <input id="meeting" placeholder="Meeting link">
  <input id="attendance" placeholder="Attendance link">
  <input id="media" placeholder="Media link">

  <button onclick="addEvent()">Add Event</button>
</div>

<!-- EVENTS -->
<div id="events"></div>

</div>

<script src="script.js"></script>
</body>
</html>
